# Python dependencies for PRQA. `poetry install` sets up a dev environment (tests + lint).
# System tools (Docker, n8n image, OpenCode, gh, ...) are not Python packages: `make install` installs those
# and then runs `poetry install`. See README.md → "Installation".
[project]
name = "prqa"
version = "0.1.0"
description = "PR QA Pilot: automated API-level QA for GitHub pull requests"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.2",       # same versions as the worker image (worker/Dockerfile)
    "jsonschema==4.25.1",
]

[tool.poetry]
package-mode = false       # scripts and services, not an installable library

[dependency-groups]
dev = ["ruff>=0.15"]

[tool.ruff]
target-version = "py311"
line-length = 160
extend-exclude = ["runs"]

[tool.ruff.lint]
# Correctness checks the code base passes today. Run: make lint
select = ["E9", "F", "PLE", "B006", "B008"]
