name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install pyyaml==6.0.2 jsonschema==4.25.1 "ruff>=0.15"
      - name: Lint
        run: ruff check scripts worker proxy mocks tests
      - name: Validate n8n workflows
        run: python scripts/build/validate_workflows.py
      - name: Unit tests
        run: python -m unittest discover -s tests
