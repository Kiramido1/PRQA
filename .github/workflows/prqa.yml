# PRQA · PR QA Pilot — request an API-level QA run for a pull request from ANY repository.
#
# Copy this file unchanged to .github/workflows/prqa.yml, then configure in the target repository
# (Settings → Secrets and variables → Actions). Full guide: docs/GITHUB_ACTIONS_ONBOARDING.md in the PRQA repository.
#
#   Secrets (required)
#     PRQA_WEBHOOK_URL      public HTTPS URL of the PRQA receiver, e.g. https://prqa.example.org/webhook/prqa/actions
#     PRQA_WEBHOOK_SECRET   the SAME value as PRQA_WEBHOOK_SECRET in the PRQA worker environment (compose/.env)
#   Variables (optional)
#     PRQA_TRIGGER_LABEL    opt-in label that starts a run when added to a PR (default: "to be test")
#     PRQA_TEST_LEVEL       smoke | standard | comprehensive | security (default: standard)
#     PRQA_HTTP_TIMEOUT_SECONDS  per-request HTTP timeout (default 30, max 120)
#
# How it works: no checkout, no PR code is executed. The job resolves the PR through the GitHub API, builds a signed
# request (HMAC-SHA256 over "<timestamp>.<body>", idempotency key repo#pr@sha:level) and POSTs it to PRQA with a bounded
# timeout and at most 3 attempts. HTTP 202 = accepted. The validated QA result is reported to Discord by PRQA once the
# job and the result validation have completed — a green job here never means the PR passed.
#
# Generated by scripts/build/build_actions_workflow.py (PRQA repository). The embedded client is scripts/clients/prqa_actions_client.py.
name: PRQA · PR QA Pilot

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to test (must belong to this repository)
        required: true
        type: string
      test_level:
        description: PRQA test level
        required: false
        default: standard
        type: choice
        options:
          - smoke
          - standard
          - comprehensive
          - security
      force_rerun:
        description: Request a new run even if this head SHA was already submitted
        required: false
        default: false
        type: boolean
  pull_request:
    types: [labeled]

# Least privilege: metadata only. PRQA posts the optional PR comment with its own token, so no write scope is needed here.
permissions:
  contents: read
  pull-requests: read

# One request at a time per PR: an overlapping label + manual trigger is serialised, and the second one
# becomes a harmless "duplicate" on the PRQA side (same idempotency key).
concurrency:
  group: prqa-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  request-qa:
    name: Request PRQA test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == (vars.PRQA_TRIGGER_LABEL || 'to be test'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard — fork pull requests cannot be requested from the label trigger
        id: guard
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        run: |
          echo "::notice::PRQA: pull request #${{ github.event.pull_request.number }} comes from a fork. Repository secrets are not available to fork PRs, so no request was sent. A maintainer can use 'Run workflow' (workflow_dispatch) instead; PRQA still applies its own fork policy."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Request a PRQA test run (signed webhook call, no checkout)
        if: steps.guard.outputs.skip != 'true'
        env:
          PRQA_WEBHOOK_URL: ${{ secrets.PRQA_WEBHOOK_URL || vars.PRQA_WEBHOOK_URL }}
          PRQA_WEBHOOK_SECRET: ${{ secrets.PRQA_WEBHOOK_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRQA_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PRQA_TEST_LEVEL: ${{ inputs.test_level || vars.PRQA_TEST_LEVEL || 'standard' }}
          PRQA_TRIGGER_LABEL: ${{ vars.PRQA_TRIGGER_LABEL || 'to be test' }}
          PRQA_FORCE_RERUN: ${{ inputs.force_rerun || 'false' }}
          PRQA_HTTP_TIMEOUT_SECONDS: ${{ vars.PRQA_HTTP_TIMEOUT_SECONDS || '30' }}
          PRQA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          python3 - <<'PRQA_CLIENT'
          #!/usr/bin/env python3
          # PRQA GitHub Actions client (v1.0). Embedded VERBATIM into .github/workflows/prqa.yml by
          # scripts/build/build_actions_workflow.py — edit this file, then regenerate. Python 3.8+ stdlib only.
          #
          # What it does, in order:
          #   1. reads its configuration from environment variables (set by the workflow; secrets never hit argv)
          #   2. fetches the pull request from the GitHub API (authoritative head SHA, base repo, state, draft)
          #   3. validates that the PR belongs to GITHUB_REPOSITORY and that every field is well-formed
          #   4. builds the PRQA request (schemas/actions-request.schema.json), derives the idempotency key
          #   5. signs "<timestamp>.<raw body>" with HMAC-SHA256(PRQA_WEBHOOK_SECRET) and POSTs it with a bounded
          #      timeout and at most PRQA_MAX_ATTEMPTS attempts (timeouts, connection errors, 429, 5xx only)
          #   6. interprets the response: 202 accepted (success), 200 duplicate (success, warning), anything else fails
          #   7. writes GITHUB_OUTPUT / GITHUB_STEP_SUMMARY. Never prints the secret, the signature or auth headers.
          #
          # HTTP 202 means "request accepted" — the test result is reported to Discord by PRQA after the job and
          # the result validation complete. It never means the PR passed.
          import hashlib
          import hmac
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          CLIENT_VERSION = "1.0"
          ENV = os.environ   # replaced by main(env=...) in tests
          REPO_RE = re.compile(r"^[A-Za-z0-9-]{1,39}/[A-Za-z0-9._-]{1,100}$")
          SHA_RE = re.compile(r"^[0-9a-f]{40}$")
          LEVELS = ("smoke", "standard", "comprehensive", "security")
          MAX_BODY_CHARS = 8000


          class ClientError(Exception):
              pass


          def log(msg):
              sys.stdout.write(msg + "\n")
              sys.stdout.flush()


          def annotate(kind, msg):
              log("::%s::%s" % (kind, msg.replace("\n", "%0A")))


          def write_output(name, value):
              path = ENV.get("GITHUB_OUTPUT")
              if path:
                  with open(path, "a", encoding="utf-8") as fh:
                      fh.write("%s=%s\n" % (name, str(value).replace("\n", " ")))


          def write_summary(lines):
              path = ENV.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a", encoding="utf-8") as fh:
                      fh.write("\n".join(lines) + "\n")


          def host_of(url):
              m = re.match(r"^https?://([^/]+)", url or "")
              return m.group(1) if m else "<invalid url>"


          def env_int(env, name, default, lo, hi):
              raw = str(env.get(name, "") or "").strip()
              try:
                  value = int(raw) if raw else default
              except ValueError:
                  raise ClientError("%s must be an integer" % name)
              return max(lo, min(hi, value))


          def read_config(env):
              url = str(env.get("PRQA_WEBHOOK_URL", "") or "").strip()
              secret = str(env.get("PRQA_WEBHOOK_SECRET", "") or "")
              if not url:
                  raise ClientError("PRQA_WEBHOOK_URL is not configured (repository secret or variable)")
              if not url.startswith("https://"):
                  if not (env.get("PRQA_ALLOW_INSECURE_URL") == "1" and re.match(r"^http://(127\.0\.0\.1|localhost)(:\d+)?/", url)):
                      raise ClientError("PRQA_WEBHOOK_URL must be an https:// URL (host: %s)" % host_of(url))
              if not secret:
                  raise ClientError("PRQA_WEBHOOK_SECRET is not configured (repository secret)")
              if len(secret) < 32:
                  raise ClientError("PRQA_WEBHOOK_SECRET is too short (use at least 32 characters, e.g. openssl rand -hex 32)")
              repo = str(env.get("GITHUB_REPOSITORY", "") or "").strip()
              if not REPO_RE.match(repo):
                  raise ClientError("GITHUB_REPOSITORY is missing or malformed")
              raw_pr = str(env.get("PRQA_PR_NUMBER", "") or "").strip()
              if not re.match(r"^[0-9]{1,8}$", raw_pr) or int(raw_pr) < 1:
                  raise ClientError("pull request number must be a positive integer (got %r)" % raw_pr[:20])
              level = str(env.get("PRQA_TEST_LEVEL", "") or "standard").strip().lower() or "standard"
              if level not in LEVELS:
                  raise ClientError("PRQA_TEST_LEVEL must be one of %s" % ", ".join(LEVELS))
              trigger = "workflow_dispatch" if env.get("GITHUB_EVENT_NAME") == "workflow_dispatch" else "label"
              override = str(env.get("PRQA_TRIGGER_OVERRIDE", "") or "").strip()
              if override:
                  if override not in ("label", "unlabel"):
                      raise ClientError("PRQA_TRIGGER_OVERRIDE must be label or unlabel")
                  trigger = override
              source = str(env.get("PRQA_SOURCE", "") or "github_actions").strip()
              if source not in ("github_actions", "local_poller"):
                  raise ClientError("PRQA_SOURCE must be github_actions or local_poller")
              return {
                  "url": url, "secret": secret, "repository": repo, "pr_number": int(raw_pr), "test_level": level, "trigger": trigger, "source": source,
                  "label": str(env.get("PRQA_TRIGGER_LABEL", "") or "to be test")[:100],
                  "force_rerun": str(env.get("PRQA_FORCE_RERUN", "") or "").lower() in ("1", "true", "yes"),
                  "timeout_s": env_int(env, "PRQA_HTTP_TIMEOUT_SECONDS", 30, 5, 120),
                  "max_attempts": env_int(env, "PRQA_MAX_ATTEMPTS", 3, 1, 5),
                  "api_url": str(env.get("GITHUB_API_URL", "") or "https://api.github.com").rstrip("/"),
                  "server_url": str(env.get("GITHUB_SERVER_URL", "") or "https://github.com").rstrip("/"),
                  "token": str(env.get("GITHUB_TOKEN", "") or ""),
                  "run_id": str(env.get("GITHUB_RUN_ID", "") or "0"),
                  "run_attempt": str(env.get("GITHUB_RUN_ATTEMPT", "") or "1"),
                  "workflow": str(env.get("GITHUB_WORKFLOW", "") or "")[:200],
                  "event_name": str(env.get("GITHUB_EVENT_NAME", "") or "")[:50],
                  "actor": str(env.get("GITHUB_ACTOR", "") or "")[:100],
                  "expected_head_sha": str(env.get("PRQA_EXPECTED_HEAD_SHA", "") or "").strip().lower(),
                  "labelled_by": str(env.get("PRQA_LABELLED_BY", "") or "")[:100] or None,
              }


          def http(opener, method, url, body, headers, timeout_s):
              """Returns (status, headers, bytes). Raises urllib errors for transport failures."""
              req = urllib.request.Request(url, data=body, method=method, headers=headers)
              try:
                  with opener(req, timeout=timeout_s) as resp:
                      return int(resp.status), dict(resp.headers.items()), resp.read()
              except urllib.error.HTTPError as err:
                  return int(err.code), dict(err.headers.items()) if err.headers else {}, err.read()


          def fetch_pull_request(cfg, opener):
              url = "%s/repos/%s/pulls/%d" % (cfg["api_url"], cfg["repository"], cfg["pr_number"])
              headers = {"Accept": "application/vnd.github+json", "User-Agent": "prqa-actions-client/" + CLIENT_VERSION,
                         "X-GitHub-Api-Version": "2022-11-28"}
              if cfg["token"]:
                  headers["Authorization"] = "Bearer " + cfg["token"]
              try:
                  status, _, raw = http(opener, "GET", url, None, headers, cfg["timeout_s"])
              except (urllib.error.URLError, OSError) as err:
                  raise ClientError("GitHub API unreachable while resolving the pull request: %s" % type(err).__name__)
              if status == 404:
                  raise ClientError("pull request #%d does not exist in %s (or the token cannot read it)" % (cfg["pr_number"], cfg["repository"]))
              if status != 200:
                  raise ClientError("GitHub API returned HTTP %d while resolving the pull request" % status)
              try:
                  pr = json.loads(raw.decode("utf-8"))
              except ValueError:
                  raise ClientError("GitHub API returned a non-JSON pull request")
              return validate_pull_request(cfg, pr)


          def validate_pull_request(cfg, pr):
              if not isinstance(pr, dict):
                  raise ClientError("pull request payload is not an object")
              if int(pr.get("number") or 0) != cfg["pr_number"]:
                  raise ClientError("GitHub returned pull request #%s, expected #%d" % (pr.get("number"), cfg["pr_number"]))
              base = pr.get("base") or {}
              head = pr.get("head") or {}
              base_repo = (base.get("repo") or {}).get("full_name")
              if base_repo != cfg["repository"]:
                  raise ClientError("pull request #%d belongs to %r, not to %s" % (cfg["pr_number"], base_repo, cfg["repository"]))
              head_sha = str(head.get("sha") or "").lower()
              base_sha = str(base.get("sha") or "").lower()
              if not SHA_RE.match(head_sha) or not SHA_RE.match(base_sha):
                  raise ClientError("pull request head/base SHA is malformed")
              state = "closed" if pr.get("state") == "closed" else "open"
              if cfg["trigger"] != "unlabel":
                  if state != "open":
                      raise ClientError("pull request #%d is %s; only open pull requests are tested" % (cfg["pr_number"], pr.get("state")))
                  if pr.get("draft"):
                      raise ClientError("pull request #%d is a draft; mark it ready for review first" % cfg["pr_number"])
              if cfg["expected_head_sha"] and cfg["expected_head_sha"] != head_sha:
                  annotate("warning", "head SHA changed since the triggering event (%s -> %s); the current head will be tested"
                           % (cfg["expected_head_sha"][:12], head_sha[:12]))
              head_repo = head.get("repo") or {}
              body = pr.get("body")
              body = (body if isinstance(body, str) else "")[:MAX_BODY_CHARS]
              return {
                  "number": cfg["pr_number"],
                  "title": str(pr.get("title") or "")[:1000],
                  "body": body,
                  "state": state,
                  "draft": bool(pr.get("draft")),
                  "html_url": "%s/%s/pull/%d" % ("https://github.com", cfg["repository"], cfg["pr_number"]),
                  "labelled_by": cfg["labelled_by"],
                  "user": {"login": str((pr.get("user") or {}).get("login") or "")[:100]},
                  "labels": [{"name": str(l.get("name") or "")[:100]} for l in (pr.get("labels") or [])[:100] if isinstance(l, dict)],
                  "head": {"ref": str(head.get("ref") or "")[:255], "sha": head_sha,
                           "repo": {"full_name": str(head_repo.get("full_name") or "")[:140], "fork": bool(head_repo.get("fork"))} if head_repo else None},
                  "base": {"ref": str(base.get("ref") or "")[:255], "sha": base_sha, "repo": {"full_name": cfg["repository"]}},
              }


          def build_request(cfg, pr):
              return {
                  "schema_version": "1.0",
                  "source": cfg["source"],
                  "repository": {"full_name": cfg["repository"], "html_url": "https://github.com/" + cfg["repository"]},
                  "pull_request": pr,
                  "request": {"test_level": cfg["test_level"], "trigger": cfg["trigger"], "label": cfg["label"],
                              "requested_by": cfg["actor"], "force_rerun": cfg["force_rerun"]},
                  "actions": {"run_id": cfg["run_id"], "run_attempt": cfg["run_attempt"],
                              "run_url": "%s/%s/actions/runs/%s" % (cfg["server_url"], cfg["repository"], cfg["run_id"]),
                              "workflow": cfg["workflow"], "event_name": cfg["event_name"], "client_version": CLIENT_VERSION},
              }


          def idempotency_key(cfg, pr):
              key = "%s:%s#%d@%s:%s" % ("poll" if cfg["source"] == "local_poller" else "gha", cfg["repository"], pr["number"], pr["head"]["sha"], cfg["test_level"])
              if cfg["force_rerun"]:
                  key += ":run-" + cfg["run_id"]
              return key


          def sign(secret, timestamp, raw_body):
              mac = hmac.new(secret.encode("utf-8"), ("%d." % int(timestamp)).encode("utf-8") + raw_body, hashlib.sha256)
              return "sha256=" + mac.hexdigest()


          def send_request(cfg, request, key, opener, sleep, clock):
              raw = json.dumps(request, separators=(",", ":"), ensure_ascii=False, sort_keys=True).encode("utf-8")
              last_error = "no attempt made"
              for attempt in range(1, cfg["max_attempts"] + 1):
                  ts = int(clock())
                  signature = sign(cfg["secret"], ts, raw)   # travels only in the header; never logged
                  headers = {"Content-Type": "application/json", "User-Agent": "prqa-actions-client/" + CLIENT_VERSION,
                             "X-PRQA-Timestamp": str(ts), "X-PRQA-Signature": signature, "X-PRQA-Idempotency-Key": key}
                  try:
                      status, resp_headers, body = http(opener, "POST", cfg["url"], raw, headers, cfg["timeout_s"])
                  except (urllib.error.URLError, OSError) as err:
                      reason = getattr(err, "reason", err)
                      last_error = "%s: %s" % (type(err).__name__, str(reason)[:120])
                      log("attempt %d/%d: transport failure (%s)" % (attempt, cfg["max_attempts"], type(err).__name__))
                  else:
                      try:
                          parsed = json.loads(body.decode("utf-8")) if body else {}
                      except ValueError:
                          parsed = {"raw": body[:200].decode("utf-8", "replace")}
                      if status in (429, 500, 502, 503, 504) and attempt < cfg["max_attempts"]:
                          retry_after = resp_headers.get("Retry-After") or (parsed.get("retry_after_s") if isinstance(parsed, dict) else None)
                          try:
                              wait = min(60.0, max(1.0, float(retry_after)))
                          except (TypeError, ValueError):
                              wait = 5.0 * attempt
                          log("attempt %d/%d: HTTP %d, retrying in %.0fs" % (attempt, cfg["max_attempts"], status, wait))
                          sleep(wait)
                          continue
                      return status, parsed if isinstance(parsed, dict) else {"raw": parsed}
                  if attempt < cfg["max_attempts"]:
                      sleep(5.0 * attempt)
              raise ClientError("PRQA webhook unreachable after %d attempts (host %s): %s" % (cfg["max_attempts"], host_of(cfg["url"]), last_error))


          def interpret(status, body, cfg, key):
              outcome = str(body.get("outcome") or "")
              reason_code = str(body.get("reason_code") or "")
              reason = str(body.get("reason") or "")[:300]
              exec_id = body.get("receiver_execution_id")
              write_output("outcome", outcome or ("http_%d" % status))
              write_output("idempotency_key", key)
              write_output("receiver_execution_id", exec_id or "")
              write_output("reason_code", reason_code)
              if status == 202 and outcome == "accepted":
                  preview = (body.get("policy_preview") or {}).get("expected_decision") or {}
                  log("PRQA accepted the request (receiver execution %s, key %s)" % (exec_id, key))
                  lines = ["## PRQA request accepted", "", "| | |", "|---|---|",
                           "| Repository | `%s` |" % cfg["repository"], "| Pull request | #%d |" % cfg["pr_number"],
                           "| Head SHA | `%s` |" % body.get("head_sha", ""), "| Test level | `%s` |" % cfg["test_level"],
                           "| Idempotency key | `%s` |" % key, "| PRQA receiver execution | `%s` |" % exec_id,
                           "| PRQA automation mode | `%s` |" % body.get("automation_mode", "?"), "",
                           "The validated QA result will be posted to Discord by PRQA when the job finishes. "
                           "This job only confirms that the request was accepted: a green job does not mean the test passed."]
                  if preview and not preview.get("allowed"):
                      msg = "PRQA policy preview: this request will be BLOCKED by the policy gate (%s: %s). No test will run until the PRQA operator enables the repository." % (preview.get("reason_code"), preview.get("reason"))
                      annotate("warning", msg)
                      lines += ["", "> ⚠️ " + msg]
                  elif preview:
                      lines += ["", "Policy preview: `%s` (%s execution)." % (preview.get("reason_code"), preview.get("execution_mode"))]
                  write_summary(lines)
                  return 0
              if status == 200 and outcome == "cancelled":
                  log("PRQA cancelled %d active job(s) for PR #%d (%s)" % (len(body.get("cancelled") or []), cfg["pr_number"], reason_code))
                  write_summary(["## PRQA lifecycle", "", "Active jobs cancelled: %d" % len(body.get("cancelled") or [])])
                  return 0
              if status == 200 and outcome == "duplicate":
                  msg = "PRQA already has a request for this repository/PR/head SHA/level (key %s, first seen %s, job %s). Nothing new was started; re-run with force_rerun=true to request a new run." % (key, body.get("first_seen_at"), body.get("job_id"))
                  annotate("warning", msg)
                  write_summary(["## PRQA request already submitted", "", msg])
                  return 0
              hints = {
                  401: "check that the GitHub secret PRQA_WEBHOOK_SECRET equals the worker's PRQA_WEBHOOK_SECRET and that the runner clock is correct (±%ss window)" % "300",
                  403: "the PRQA operator must register %s in config/repositories.yaml" % cfg["repository"],
                  422: "the request was rejected by validation",
                  429: "rate limited; wait and retry",
                  503: "the PRQA worker is unavailable; retry later",
              }
              detail = "; ".join(str(e)[:120] for e in (body.get("errors") or [])[:5])
              msg = "PRQA rejected the request: HTTP %d %s %s — %s%s. %s" % (status, outcome or "", reason_code, reason, (" (" + detail + ")") if detail else "", hints.get(status, ""))
              annotate("error", msg)
              write_summary(["## PRQA request failed", "", msg])
              return 1


          def main(env=None, opener=urllib.request.urlopen, sleep=time.sleep, clock=time.time):
              global ENV
              env = os.environ if env is None else env
              ENV = env
              try:
                  cfg = read_config(env)
                  log("PRQA request: %s #%d level=%s trigger=%s target=%s" % (cfg["repository"], cfg["pr_number"], cfg["test_level"], cfg["trigger"], host_of(cfg["url"])))
                  pr = fetch_pull_request(cfg, opener)
                  key = idempotency_key(cfg, pr)
                  request = build_request(cfg, pr)
                  log("resolved PR #%d head=%s base=%s fork=%s key=%s" % (pr["number"], pr["head"]["sha"][:12], pr["base"]["ref"], bool((pr["head"].get("repo") or {}).get("fork")), key))
                  status, body = send_request(cfg, request, key, opener, sleep, clock)
                  return interpret(status, body, cfg, key)
              except ClientError as err:
                  annotate("error", "PRQA client: %s" % err)
                  write_output("outcome", "client_error")
                  write_summary(["## PRQA request not sent", "", str(err)])
                  return 1


          if __name__ == "__main__":
              sys.exit(main())
          PRQA_CLIENT
